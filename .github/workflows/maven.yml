# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: '**'
  pull_request:
    branches: [ main ]

env:
  # server-config-props-it fix
  MAVEN_HOME: $(which mvn)

jobs:
# UNIX BUILDS
  build-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        # test against latest update of each major Java version, as well as specific updates of LTS versions:
        RUNTIME: [ol, wlp]
        RUNTIME_VERSION: [26.0.0.6]
        java: [25, 21, 17]
        exclude:
          - java: 17
            RUNTIME: wlp
          - java: 21
            RUNTIME: ol
    name: ${{ matrix.RUNTIME }} ${{ matrix.RUNTIME_VERSION }}, Java ${{ matrix.java }}, Linux
    steps:
      # Checkout repos
      - name: Checkout ci.maven
        uses: actions/checkout@v3
      - name: Pre-install JDK 8 (for toolchains)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'semeru'
      - name: Pre-install JDK 11 (for toolchains)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'semeru'
      - name: Pre-install JDK 17 (If Not Matrix Version)
        if: ${{ matrix.java != '17' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'
      - name: Pre-install JDK 21 (If Not Matrix Version)
        if: ${{ matrix.java != '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'semeru'
      - name: Pre-install JDK 25 (If Not Matrix Version)
        if: ${{ matrix.java != '25' }}
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'semeru'
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Verify JAVA_HOME and Installed JDKs
        run: |
          echo "Primary JAVA_HOME is set to: $JAVA_HOME"
          java -version
      - name: Free disk space ubuntu
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - name: Verify ~/.m2/toolchains.xml content
        run: |
          echo "Checking for toolchains.xml in: $HOME/.m2/"
          ls -l $HOME/.m2/toolchains.xml 2> /dev/null || echo "File does not exist or permission denied."
          echo "--- toolchains.xml content ---"
          if [ -f $HOME/.m2/toolchains.xml ]; then
            cat $HOME/.m2/toolchains.xml
          else
            echo "Cannot display content: $HOME/.m2/toolchains.xml not found."
          fi
          echo "----------------------------"
      - name: Checkout ci.common
        uses: actions/checkout@v3
        with:
          repository: OpenLiberty/ci.common
          path: ci.common
      - name: Checkout ci.ant
        uses: actions/checkout@v3
        with:
          repository: OpenLiberty/ci.ant
          path: ci.ant
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 4.0.0-rc-6
      # Install dependencies
      - name: Install ci.ant and ci.common
        timeout-minutes: 15
        run: |
          ./mvnw -V clean install -f ci.ant --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -DskipTests -Dinvoker.skip=true
          ./mvnw -V clean install -f ci.common --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -DskipTests -Dinvoker.skip=true
      # Run tests
      - name: Run tests
        timeout-minutes: 120
        run: ./mvnw -V verify --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -Ponline-its -D"invoker.streamLogsOnFailures"=true -Druntime=${{ matrix.RUNTIME }} -DruntimeVersion="${{ matrix.RUNTIME_VERSION }}"

# WINDOWS BUILD
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        # test against latest update of each major Java version, as well as specific updates of LTS versions:
        RUNTIME: [ol, wlp]
        RUNTIME_VERSION: [ 25.0.0.12 ]
        java: [ 25, 21, 17 ]
        exclude:
          - java: 17
            RUNTIME: wlp
          - java: 21
            RUNTIME: ol
    name: ${{ matrix.RUNTIME }} ${{ matrix.RUNTIME_VERSION }}, Java ${{ matrix.java }}, Windows
    steps:
      # Checkout repos
      - name: Checkout ci.maven
        uses: actions/checkout@v3
      - name: Pre-install JDK 8 (for toolchains)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'semeru'
      - name: Pre-install JDK 11 (for toolchains)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'semeru'
      - name: Pre-install JDK 17 (If Not Matrix Version)
        if: ${{ matrix.java != '17' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'
      - name: Pre-install JDK 21 (If Not Matrix Version)
        if: ${{ matrix.java != '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'semeru'
      - name: Pre-install JDK 25 (If Not Matrix Version)
        if: ${{ matrix.java != '25' }}
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'semeru'
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Verify JAVA_HOME and Installed JDKs
        run: |
          echo "Primary JAVA_HOME is set to: $JAVA_HOME"
          java -version
      - name: Verify ~/.m2/toolchains.xml content
        shell: bash
        run: |
          echo "Checking for toolchains.xml in: $HOME/.m2/"
          ls -l $HOME/.m2/toolchains.xml 2> /dev/null || echo "File does not exist or permission denied."
          echo "--- toolchains.xml content ---"
          if [ -f $HOME/.m2/toolchains.xml ]; then
            cat $HOME/.m2/toolchains.xml
          else
            echo "Cannot display content: $HOME/.m2/toolchains.xml not found."
          fi
          echo "----------------------------"
      # Clone to same github workspace used for ci.maven checkout
      - name: Clone ci.ant and ci.common repos to github.workspace
        run: |
          echo ${{github.workspace}}
          git clone https://github.com/OpenLiberty/ci.common.git ${{github.workspace}}/ci.common
          git clone https://github.com/OpenLiberty/ci.ant.git ${{github.workspace}}/ci.ant
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 4.0.0-rc-6
      # Install ci.ant
      - name: Install ci.ant
        working-directory: ${{github.workspace}}/ci.ant
        timeout-minutes: 15
        run: .\mvnw.cmd -V clean install --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -DskipTests -Dinvoker.skip=true
      # Install ci.common
      - name: Install ci.common
        working-directory: ${{github.workspace}}/ci.common
        timeout-minutes: 15
        run: .\mvnw.cmd -V clean install --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -DskipTests -Dinvoker.skip=true
      # Run tests
      - name: Run tests
        working-directory: ${{github.workspace}}
        timeout-minutes: 150
        run: .\mvnw.cmd -V verify -Ponline-its --batch-mode --no-transfer-progress --errors -DtrimStackTrace=false -D"invoker.streamLogsOnFailures"=true -Druntime=${{ matrix.RUNTIME }} -DruntimeVersion="${{ matrix.RUNTIME_VERSION }}"
